name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. SSH key setup ────────────────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/yooz-key.pem
          chmod 400 ~/.ssh/yooz-key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # ── 3. Sync AWS Secrets Manager ─────────────────────────
      #    Auto-syncs every GitHub Secret named SM_* to AWS
      #    Secrets Manager. Add a new env var by creating a new
      #    GitHub Secret SM_<NAME> — no workflow edit needed.
      #    Merges with current AWS secret (never wipes keys not
      #    in GitHub) and skips the API call if nothing changed.
      - name: Sync AWS Secrets Manager
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess

          # Static literals (not stored in GitHub Secrets)
          STATIC = {
            "PORT":        "3000",
            "CORS_ORIGIN": "https://yooz.org.il,https://www.yooz.org.il",
            "APP_URL":     "https://yooz.org.il",
          }

          # Pull every SM_* GitHub Secret, strip prefix
          gh = json.loads(os.environ["ALL_SECRETS"])
          from_gh = {k[3:]: v for k, v in gh.items() if k.startswith("SM_")}

          # Pull current AWS secret (so we merge, not replace)
          r = subprocess.run([
            "aws", "secretsmanager", "get-secret-value",
            "--secret-id", "yooz/production",
            "--region", "eu-west-1",
            "--query", "SecretString", "--output", "text"
          ], capture_output=True, text=True)
          current = json.loads(r.stdout) if r.returncode == 0 and r.stdout.strip() else {}

          merged = {**current, **from_gh, **STATIC}

          if merged == current:
            print("✓ No changes to AWS Secrets Manager")
          else:
            added   = sorted(set(merged) - set(current))
            changed = sorted(k for k in merged if k in current and current[k] != merged[k])
            if added:   print("  + added:  ", ", ".join(added))
            if changed: print("  ~ changed:", ", ".join(changed))

            r = subprocess.run([
              "aws", "secretsmanager", "update-secret",
              "--secret-id", "yooz/production",
              "--secret-string", json.dumps(merged),
              "--region", "eu-west-1"
            ], capture_output=True, text=True)
            if r.returncode != 0:
              print("❌", r.stderr); exit(1)
            print("✅ Secrets Manager updated")
          PYEOF

      # ── 4. Sync code to EC2 ─────────────────────────────────
      - name: Sync code to EC2
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/yooz-key.pem -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude 'client/dist' \
            --exclude 'server/dist' \
            --exclude '.git' \
            --exclude 'deploy/.ec2-info' \
            ./ \
            ubuntu@${{ secrets.EC2_HOST }}:/opt/yooz/

      # ── 5. Build & restart on EC2 ───────────────────────────
      - name: Build & restart app
        run: |
          ssh -i ~/.ssh/yooz-key.pem -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.EC2_HOST }} /bin/bash -s <<'ENDSSH'
            set -e

            echo "=== Fetching secrets from AWS Secrets Manager ==="
            /usr/local/bin/aws secretsmanager get-secret-value \
              --secret-id "yooz/production" \
              --region "eu-west-1" \
              --query SecretString \
              --output text \
            | python3 -c "
          import sys, json
          s = json.load(sys.stdin)
          open('/etc/yooz/prod.env','w').writelines(f'{k}={v}\n' for k,v in s.items())
          print('  Loaded', len(s), 'env vars')
          "
            chmod 600 /etc/yooz/prod.env

            echo "=== Building server ==="
            cd /opt/yooz/server
            npm install 2>&1 | tail -2
            npm run build

            echo "=== Building client ==="
            cd /opt/yooz/client
            npm install 2>&1 | tail -2
            set -a; source /etc/yooz/prod.env; set +a
            npm run build

            echo "=== Updating PM2 ecosystem ==="
            python3 -c "
          import json
          env = dict(l.strip().split('=',1) for l in open('/etc/yooz/prod.env') if '=' in l)
          cfg = {'apps':[{'name':'yooz','script':'dist/index.js','cwd':'/opt/yooz/server',
                 'instances':1,'autorestart':True,'watch':False,'max_memory_restart':'800M',
                 'error_file':'/var/log/yooz/error.log','out_file':'/var/log/yooz/out.log',
                 'merge_logs':True,'time':True,'env':env}]}
          open('/opt/yooz/deploy/ecosystem.config.js','w').write('module.exports = '+json.dumps(cfg,indent=2)+';\n')
          print('  ecosystem.config.js updated')
          "

            echo "=== Restarting PM2 ==="
            pm2 delete yooz 2>/dev/null || true
            pm2 start /opt/yooz/deploy/ecosystem.config.js
            pm2 save

            sleep 4
            pm2 show yooz | grep -E "status|restart|uptime"
            curl -s -o /dev/null -w "Health check: %{http_code}\n" http://localhost:3000
          ENDSSH

      # ── 6. Summary ──────────────────────────────────────────
      - name: Done
        run: echo "🎉 Live at https://yooz.org.il — commit ${{ github.sha }}"
