<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Throw Ball Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@400;700;800&display=block" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="../../languages.js"></script>
  </head>
  <body>
    <div class="cOrientationCont" aria-hidden="true">
      <div id="OrientationMsg" class="cOrientationMsg"></div>
    </div>
    <div id="iMute"></div>
    <div id="phaser-example" class="game-root"></div>
    <div id="text-layer" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50;overflow:hidden;"></div>
    <div class="cHome" id="iPreloaderBg"></div>
    <div class="cPreloader">
        <div class="cPreloaderBar"></div>
        <div class="cPreloaderText"></div>
    </div>
    <div class="cHome" id="iHome">
      <div class="cInstructionBg">
        <h4 id="bonusTitle">Get Ready</h4>
        <div class="cDescStack">
          <p id="bonusContent">
            Answer all questions successfully!
          </p>
          <div id="iStart" class="cBallStartBtn">
            Continue
          </div>
        </div>
      </div>
    </div>

    <!-- JS attachment -->
    <script src="js/phaser.2.2.2.box2d.min.js"></script>
    <script>
      (function setupBridge() {
        const params = new URLSearchParams(window.location.search);
        const lang = params.get('lang') || localStorage.getItem('yooz_lang') || 'en';
        const dir = params.get('dir') || (lang === 'he' ? 'rtl' : 'ltr');
        const timeLimit = Number(params.get('timeLimit')) || 30;
        const embedded = params.get('embedded') === '1';
        const useTextOverlay = params.get('useTextOverlay') === '1';
        window.__ballgameTimeLimit = timeLimit;
        window.__ballgameEmbedded = embedded;
        window.__ballgameUseTextOverlay = useTextOverlay;
        localStorage.setItem('language', lang);
        localStorage.setItem('dir', dir);
        localStorage.setItem('currentGameId', params.get('gameId') || 'ballgame-embedded');

        const bridgeState = {
          initPayload: null,
          initResolvers: [],
          scorePayload: null,
          detailedReports: [],
          completed: false,
        };

        const notifyParent = (type, payload) => {
          if (!window.parent || window.parent === window) return;
          window.parent.postMessage({ source: 'yooz-ballgame', type, payload }, '*');
        };

        const resolveInit = (payload) => {
          bridgeState.initPayload = payload;
          for (const resolve of bridgeState.initResolvers) resolve(payload);
          bridgeState.initResolvers = [];
        };

        window.addEventListener('message', (event) => {
          const data = event.data;
          if (!data || data.source !== 'yooz-host') return;

          if (data.type === 'BALLGAME_INIT') {
            const payload = data.payload || {};
            resolveInit(payload);
            if (payload.gameName) {
              const titleEl = document.getElementById('bonusTitle');
              if (titleEl) titleEl.textContent = payload.gameName;
            }
            return;
          }

          if (data.type === 'BALLGAME_TOGGLE_MUTE' && typeof window.toggleMute === 'function') {
            window.toggleMute();
          }
        });

        const waitForInit = () =>
          new Promise((resolve) => {
            if (bridgeState.initPayload) {
              resolve(bridgeState.initPayload);
            } else {
              bridgeState.initResolvers.push(resolve);
            }
          });

        window.loadGame = function loadGame() {
          return waitForInit().then((payload) => {
            const configurations = Array.isArray(payload.configurations)
              ? payload.configurations
              : [];
            return {
              scoreDoc: {
                exists: false,
                data: function () { return {}; },
              },
              configurationDoc: {
                exists: true,
                data: function () { return { configurations }; },
              },
            };
          });
        };

        window.uploadScoreReport = function uploadScoreReport(payload) {
          bridgeState.scorePayload = payload || null;
          notifyParent('BALLGAME_PROGRESS', payload || {});
          return Promise.resolve();
        };

        window.uploadDetailedReport = function uploadDetailedReport(index, payload) {
          bridgeState.detailedReports.push({ index, payload });
          notifyParent('BALLGAME_DETAILED', { index, payload });
          return Promise.resolve();
        };

        window.completeComponentAndNavigate = function completeComponentAndNavigate() {
          if (bridgeState.completed) return Promise.resolve();
          bridgeState.completed = true;
          notifyParent('BALLGAME_COMPLETE', {
            scoreReport: bridgeState.scorePayload || {},
            detailedReports: bridgeState.detailedReports.slice(),
          });
          return Promise.resolve();
        };

        window.navigateToComponentScreen = function navigateToComponentScreen() {
          notifyParent('BALLGAME_BACK', {});
        };
      })();
    </script>
    <script src="js/windowFocusStatus.js"></script>
    <script src="js/customizedTimer.js"></script>
    <script>
      (function() {
        var s = document.createElement('script');
        s.src = 'js/main.js?t=' + Date.now();
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
