<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="1000" viewBox="0 0 600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <clipPath id="balloonClip">
      <ellipse cx="300" cy="300" rx="230" ry="230"/>
    </clipPath>
    <linearGradient id="ropeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f8fb"/>
      <stop offset="100%" stop-color="#d7dbe4"/>
    </linearGradient>
    <linearGradient id="basketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fc"/>
      <stop offset="100%" stop-color="#c2c8d6"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <ellipse cx="300" cy="300" rx="230" ry="230" fill="#183e6b"/>
    <g clip-path="url(#balloonClip)">
      <rect x="40" y="102" width="520" height="66" fill="#f7fbff"/>
      <rect x="40" y="184" width="520" height="22" fill="#dce5f1"/>
      <rect x="40" y="255" width="520" height="84" fill="#ffffff"/>
      <rect x="40" y="394" width="520" height="58" fill="#f7fbff"/>
    </g>
    <ellipse cx="300" cy="300" rx="230" ry="230" fill="none" stroke="#0f3155" stroke-width="10"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <text x="300" y="278" font-size="70" fill="#ffffff">Balloon</text>
    <text x="300" y="344" font-size="76" fill="#cde5e6">&amp;MORE</text>
    <text x="214" y="229" font-size="32" fill="#dbe8f8" opacity="0.95">TLV</text>
  </g>

  <g stroke="url(#ropeGrad)" stroke-width="8" stroke-linecap="round">
    <line x1="236" y1="500" x2="254" y2="684"/>
    <line x1="270" y1="510" x2="276" y2="692"/>
    <line x1="300" y1="514" x2="300" y2="697"/>
    <line x1="330" y1="510" x2="324" y2="692"/>
    <line x1="364" y1="500" x2="346" y2="684"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M244 716 Q300 680 356 716 L344 766 Q300 794 256 766 Z" fill="url(#basketGrad)" stroke="#9ca6b9" stroke-width="5"/>
    <ellipse cx="300" cy="716" rx="60" ry="14" fill="#edf0f6" opacity="0.82"/>
    <ellipse cx="300" cy="767" rx="46" ry="11" fill="#8f98aa" opacity="0.45"/>
  </g>
</svg>
