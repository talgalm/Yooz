<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" fill="none" role="img">
  <!-- Soft grounds, echoing the Venn lobes on the home page. -->
  <ellipse cx="140" cy="120" rx="112" ry="96" fill="#E8D8FF" opacity="0.55"/>
  <ellipse cx="396" cy="300" rx="118" ry="98" fill="#FFE8E8" opacity="0.6"/>
  <ellipse cx="392" cy="104" rx="70" ry="62" fill="#C0C8FF" opacity="0.4"/>

  <!-- The activity as it is actually played: one phone, one route, ordered stations. -->
  <rect x="180" y="44" width="162" height="322" rx="28" fill="#FFFFFF" stroke="#380850" stroke-width="3.5"/>
  <rect x="193" y="68" width="136" height="274" rx="17" fill="#FDF6FF"/>
  <rect x="245" y="53" width="32" height="11" rx="5.5" fill="#380850"/>

  <!-- The route between stations. -->
  <path d="M216 316 C 268 306 286 282 288 254 C 290 222 232 216 216 188 C 202 164 244 132 298 118"
        stroke="#6A0E9A" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9" fill="none"/>

  <circle cx="216" cy="316" r="12" fill="#FBBF24"/>
  <circle cx="288" cy="254" r="12" fill="#C0C8FF"/>
  <circle cx="216" cy="188" r="12" fill="#E8D8FF"/>
  <circle cx="300" cy="117" r="15" fill="#6A0E9A"/>
  <path d="m293.5 117 4.5 4.5 9-9.5" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AutoClip: the personal video the participant leaves with. -->
  <g transform="translate(352 150)">
    <rect x="0" y="0" width="124" height="84" rx="15" fill="#FFFFFF" stroke="#D8C4EC" stroke-width="2.5"/>
    <circle cx="34" cy="42" r="17" fill="#FFE8FF"/>
    <path d="M30 34.5 41 42 30 49.5z" fill="#6A0E9A"/>
    <rect x="60" y="33" width="46" height="6" rx="3" fill="#E8D8FF"/>
    <rect x="60" y="46" width="32" height="6" rx="3" fill="#EFE6F7"/>
  </g>

  <!-- A badge, for the scoring side of the same journey. -->
  <g transform="translate(64 272)">
    <circle cx="34" cy="34" r="32" fill="#FFE8FF" stroke="#6A0E9A" stroke-width="2.5"/>
    <path d="m34 17 5.2 10.9 11.8 1.7-8.5 8.4 2 11.8L34 44.2 22.5 49.8l2-11.8-8.5-8.4 11.8-1.7z" fill="#FBBF24"/>
  </g>

  <!-- Sparkles: the AI-graded stations. -->
  <path d="M452 62 456 74 468 78 456 82 452 94 448 82 436 78 448 74z" fill="#B24BD8" opacity="0.85"/>
  <path d="M116 78 118.6 85.4 126 88 118.6 90.6 116 98 113.4 90.6 106 88 113.4 85.4z" fill="#E9479A" opacity="0.8"/>
  <path d="M424 350 426.8 357.8 434.6 360.6 426.8 363.4 424 371.2 421.2 363.4 413.4 360.6 421.2 357.8z" fill="#6A0E9A" opacity="0.55"/>
</svg>
