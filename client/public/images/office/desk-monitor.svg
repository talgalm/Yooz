<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" fill="none">
  <!-- Desk shadow -->
  <rect x="6" y="14" width="108" height="60" rx="4" fill="#000" opacity="0.08"/>
  <!-- Desk top -->
  <rect x="4" y="10" width="108" height="60" rx="4" fill="#f4f1ec" stroke="#cfc8be" stroke-width="1.5"/>
  <rect x="8" y="14" width="100" height="52" rx="2" fill="#fbfaf6"/>
  <!-- Desk side edge -->
  <rect x="4" y="68" width="108" height="4" rx="1" fill="#d8d2c6"/>
  <!-- Monitor base/stand -->
  <rect x="50" y="28" width="20" height="3" rx="1" fill="#8e95a0"/>
  <rect x="58" y="22" width="4" height="8" fill="#a8aeb8"/>
  <!-- Monitor -->
  <rect x="34" y="6" width="52" height="22" rx="2" fill="#2d333d" stroke="#1c2027" stroke-width="1"/>
  <rect x="36.5" y="8.5" width="47" height="17" rx="1" fill="#7fc7e8"/>
  <rect x="36.5" y="8.5" width="47" height="6" rx="1" fill="#a8dcef" opacity="0.6"/>
  <!-- Chair -->
  <ellipse cx="60" cy="100" rx="22" ry="6" fill="#000" opacity="0.1"/>
  <!-- Chair backrest -->
  <rect x="42" y="78" width="36" height="8" rx="3" fill="#3c4250"/>
  <!-- Chair seat -->
  <ellipse cx="60" cy="98" rx="20" ry="14" fill="#4a5160" stroke="#2e3441" stroke-width="1"/>
  <ellipse cx="60" cy="96" rx="17" ry="11" fill="#5a6271"/>
  <!-- Chair wheel base spokes -->
  <line x1="60" y1="98" x2="44" y2="116" stroke="#2e3441" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="98" x2="76" y2="116" stroke="#2e3441" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="98" x2="60" y2="120" stroke="#2e3441" stroke-width="2" stroke-linecap="round"/>
  <circle cx="44" cy="117" r="2.5" fill="#2e3441"/>
  <circle cx="76" cy="117" r="2.5" fill="#2e3441"/>
  <circle cx="60" cy="121" r="2.5" fill="#2e3441"/>
</svg>
