<svg width="200" height="220" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Chimney -->
  <rect x="130" y="20" width="22" height="45" rx="2" fill="#8B6F5E"/>
  <rect x="127" y="16" width="28" height="8" rx="2" fill="#7A5F4E"/>
  <!-- Chimney smoke wisps -->
  <ellipse cx="141" cy="10" rx="8" ry="5" fill="#ccc" opacity="0.3"/>
  <ellipse cx="145" cy="2" rx="6" ry="4" fill="#ccc" opacity="0.2"/>
  <!-- Roof -->
  <polygon points="100,60 0,110 200,110" fill="#A0522D"/>
  <polygon points="100,60 2,110 8,110 100,67" fill="#B5633A" opacity="0.5"/>
  <!-- Roof texture lines -->
  <line x1="30" y1="100" x2="170" y2="100" stroke="#8B4513" stroke-width="0.5" opacity="0.4"/>
  <line x1="45" y1="90" x2="155" y2="90" stroke="#8B4513" stroke-width="0.5" opacity="0.3"/>
  <line x1="60" y1="80" x2="140" y2="80" stroke="#8B4513" stroke-width="0.5" opacity="0.3"/>
  <!-- Walls -->
  <rect x="15" y="108" width="170" height="100" fill="#F5E6CA"/>
  <rect x="15" y="108" width="170" height="100" fill="none" stroke="#D4C4A8" stroke-width="1"/>
  <!-- Stone texture -->
  <line x1="15" y1="135" x2="185" y2="135" stroke="#D4C4A8" stroke-width="0.5" opacity="0.5"/>
  <line x1="15" y1="162" x2="185" y2="162" stroke="#D4C4A8" stroke-width="0.5" opacity="0.5"/>
  <!-- Window left -->
  <rect x="35" y="125" width="30" height="35" rx="2" fill="#87CEEB" stroke="#8B7355" stroke-width="1.5"/>
  <line x1="50" y1="125" x2="50" y2="160" stroke="#8B7355" stroke-width="1"/>
  <line x1="35" y1="142" x2="65" y2="142" stroke="#8B7355" stroke-width="1"/>
  <!-- Window right -->
  <rect x="135" y="125" width="30" height="35" rx="2" fill="#87CEEB" stroke="#8B7355" stroke-width="1.5"/>
  <line x1="150" y1="125" x2="150" y2="160" stroke="#8B7355" stroke-width="1"/>
  <line x1="135" y1="142" x2="165" y2="142" stroke="#8B7355" stroke-width="1"/>
  <!-- Door -->
  <rect x="80" y="160" width="40" height="48" rx="4" fill="#6B4226"/>
  <rect x="80" y="160" width="40" height="48" rx="4" fill="none" stroke="#5A3620" stroke-width="1.5"/>
  <circle cx="112" cy="186" r="3" fill="#D4A844"/>
  <!-- Ground / grass tufts -->
  <ellipse cx="10" cy="210" rx="18" ry="5" fill="#5B8C3E" opacity="0.6"/>
  <ellipse cx="190" cy="210" rx="16" ry="5" fill="#5B8C3E" opacity="0.6"/>
  <ellipse cx="100" cy="212" rx="110" ry="4" fill="#6B9E4A" opacity="0.3"/>
</svg>
