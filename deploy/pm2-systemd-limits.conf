# systemd drop-in that caps PM2's CPU + memory at the kernel level.
# Belt-and-suspenders for the in-app load-shedding: even if Node's circuit
# breaker fails (orphan ffmpeg, leaked Buffer, anything), the kernel keeps
# enough headroom for SSH + Nginx so we can still recover the box.
#
# Installed by deploy/3-deploy.sh at:
#   /etc/systemd/system/pm2-ubuntu.service.d/limits.conf
#
# On t3.medium (2 vCPU, 4 GB):
#   CPUQuota=180%  → app can use up to 1.8 cores. 0.2 left for OS/SSH/nginx.
#   MemoryHigh=2.5G → soft cap; cgroup starts throttling here.
#   MemoryMax=3G    → hard ceiling; OOM-kill PM2 children, not the whole box.
#
# Tune up when you move to a bigger box.

[Service]
CPUQuota=180%
MemoryHigh=2.5G
MemoryMax=3G
TasksMax=512
